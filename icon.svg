<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#223422"/>
  <!-- art scaled into the maskable safe circle, so round launchers don't clip the corners -->
  <g transform="translate(256 256) scale(0.84) translate(-256 -256)">
  <!-- page with a folded corner -->
  <path d="M168 112h128l64 64v224a16 16 0 0 1-16 16H168a16 16 0 0 1-16-16V128a16 16 0 0 1 16-16z" fill="#FAF9F7"/>
  <path d="M296 112v48a16 16 0 0 0 16 16h48z" fill="#C9C4BB"/>
  <!-- lines of text -->
  <g fill="#9AA79A">
    <rect x="188" y="200" width="136" height="14" rx="7"/>
    <rect x="188" y="236" width="112" height="14" rx="7"/>
    <rect x="188" y="320" width="124" height="14" rx="7"/>
    <rect x="188" y="356" width="88" height="14" rx="7"/>
  </g>
  <!-- the scan line -->
  <rect x="120" y="270" width="272" height="20" rx="10" fill="#E04848"/>
  <!-- corner brackets -->
  <g fill="none" stroke="#A9C8A6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 152v-48h48"/>
    <path d="M360 104h48v48"/>
    <path d="M408 360v48h-48"/>
    <path d="M152 408h-48v-48"/>
  </g>
  </g>
</svg>
